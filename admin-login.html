<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بوابة الإدارة - بوابة الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#4f46e5; --primary-light:#818cf8; --primary-dark:#3730a3;
  --secondary:#0ea5e9; --success:#10b981; --danger:#ef4444; --warn:#f59e0b;
  --bg:#f8fafc; --bg-card:#ffffff; --text:#0f172a; --text-secondary:#64748b; --text-light:#94a3b8;
  --border:#e2e8f0; --shadow-lg:0 20px 60px rgba(30,27,75,.28); --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --radius-sm:10px; --radius-md:16px; --radius-lg:28px;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
  --font-family:'Cairo','Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-family);
  color:var(--text);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%, rgba(129,140,248,.55), transparent 45%),
    radial-gradient(circle at 85% 20%, rgba(56,189,248,.45), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(55,48,163,.6), transparent 55%),
    linear-gradient(160deg, #1e1b4b 0%, var(--primary-dark) 45%, var(--primary) 100%);
}
body::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:26px 26px; opacity:.5; pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes floatIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-5px);}40%,60%{transform:translateX(5px);}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(129,140,248,.55);}70%{box-shadow:0 0 0 16px rgba(129,140,248,0);}100%{box-shadow:0 0 0 0 rgba(129,140,248,0);}}
@keyframes tickRotate{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes swingOpen{0%{transform:rotate(0deg);}100%{transform:rotate(-38deg) translateX(-6px);}}
@keyframes glowSweep{0%{opacity:0;transform:scale(.6);}60%{opacity:1;}100%{opacity:0;transform:scale(2.4);}}

.wrap{position:relative;z-index:1;width:100%;max-width:400px;}

/* ===== المرحلة 1: البوابة الرقمية ===== */
#gate-card{
  background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:40px 30px 32px; text-align:center; animation:floatIn .5s ease both;
}
.lock-stage{width:110px;height:110px;margin:0 auto 22px;position:relative;display:flex;align-items:center;justify-content:center;}
.lock-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--primary-light);opacity:.55;animation:tickRotate 14s linear infinite;}
.lock-core{
  width:80px;height:80px;border-radius:22px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
  box-shadow:0 10px 24px rgba(79,70,229,.4);
  animation:pulseRing 2.2s ease-in-out infinite;
  transition:var(--transition);
}
.lock-core i{font-size:32px;color:#fff;transition:var(--transition);}
.lock-core.unlocked{transform:rotate(-8deg) scale(1.06);}
.glow-burst{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.6),transparent 70%);opacity:0;pointer-events:none;}
.glow-burst.play{animation:glowSweep .6s ease-out;}

#gate-card h1{font-size:19px;font-weight:800;}
#gate-card .sub{font-size:12.5px;color:var(--text-secondary);margin-top:6px;margin-bottom:26px;line-height:1.7;}

.code-input-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;direction:ltr;}
.code-digit{
  width:44px;height:52px;border:2px solid var(--border);border-radius:var(--radius-sm);
  text-align:center;font-size:20px;font-weight:800;font-family:var(--font-family);
  outline:none;background:var(--bg);color:var(--text);transition:var(--transition);
}
.code-digit:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.code-digit.filled{border-color:var(--primary-light);background:#fff;}
.code-digit.error{border-color:var(--danger);animation:shake .4s ease;}

.err-box{
  background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;
  padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;display:none;gap:8px;align-items:center;justify-content:center;text-align:center;
}
.err-box.show{display:flex;}

.unlock-btn{
  width:100%;padding:13px;margin-top:4px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border:none;border-radius:var(--radius-sm);
  font-family:var(--font-family);font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition);
}
.unlock-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,.35);}
.unlock-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}

.attempts-note{margin-top:14px;font-size:11px;color:var(--text-light);}
.lockout-timer{margin-top:14px;font-size:12px;color:var(--danger);font-weight:700;}

/* ===== المرحلة 2: تسجيل دخول جوجل ===== */
#login-card{
  background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:44px 32px 34px; text-align:center; display:none;
}
#login-card.show{display:block;animation:floatIn .5s ease both;}
.logo-badge{
  width:74px;height:74px;border-radius:22px;margin:0 auto 18px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(79,70,229,.35);
}
.logo-badge i{font-size:32px;color:#fff;}
#login-card h1{font-size:20px;font-weight:800;}
#login-card .sub{font-size:12.5px;color:var(--text-secondary);margin-top:6px;margin-bottom:28px;line-height:1.7;}

.google-btn{
  width:100%;padding:13px 16px;
  background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-family:var(--font-family);font-weight:700;font-size:14px;color:var(--text);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:var(--transition);
}
.google-btn:hover{border-color:var(--primary-light);box-shadow:0 6px 18px rgba(79,70,229,.15);transform:translateY(-1px);}
.google-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
.google-btn svg{width:19px;height:19px;flex-shrink:0;}

.access-note{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;
  padding:11px 14px;background:var(--bg);border-radius:var(--radius-sm);
  font-size:11.5px;color:var(--text-secondary);line-height:1.6;
}
.access-note i{color:var(--primary);flex-shrink:0;}

.footnote{text-align:center;margin-top:22px;font-size:11px;color:rgba(255,255,255,.8);}
.footnote i{margin-left:4px;}

#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:14px;}
.spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;}
</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><p style="font-size:13px;color:var(--text-secondary)">جاري التحقق...</p></div>

<div class="wrap">

  <!-- المرحلة 1: البوابة الرقمية -->
  <div id="gate-card">
    <div class="lock-stage">
      <div class="lock-ring"></div>
      <div class="glow-burst" id="glow-burst"></div>
      <div class="lock-core" id="lock-core"><i class="fas fa-lock" id="lock-icon"></i></div>
    </div>
    <h1>بوابة الوصول المحمية</h1>
    <p class="sub">أدخل رمز الدخول السري لفتح صفحة تسجيل دخول الإدارة</p>

    <div id="err-box" class="err-box"><i class="fas fa-triangle-exclamation"></i><span id="err-text"></span></div>

    <div class="code-input-row" id="code-row">
      <input type="text" maxlength="1" class="code-digit" data-i="0">
      <input type="text" maxlength="1" class="code-digit" data-i="1">
      <input type="text" maxlength="1" class="code-digit" data-i="2">
      <input type="text" maxlength="1" class="code-digit" data-i="3">
      <input type="text" maxlength="1" class="code-digit" data-i="4">
      <input type="text" maxlength="1" class="code-digit" data-i="5">
    </div>

    <button class="unlock-btn" id="unlock-btn" onclick="attemptUnlock()"><i class="fas fa-unlock"></i> فتح البوابة</button>
    <p class="attempts-note" id="attempts-note">لديك 3 محاولات</p>
  </div>

  <!-- المرحلة 2: تسجيل الدخول بجوجل -->
  <div id="login-card">
    <div class="logo-badge"><i class="fas fa-shield-halved"></i></div>
    <h1>لوحة تحكم الإدارة</h1>
    <p class="sub">بوابة الطلاب — الدخول مقتصر على فريق الإدارة المُصرّح له فقط</p>

    <div id="err-box-2" class="err-box"><i class="fas fa-triangle-exclamation"></i><span id="err-text-2"></span></div>

    <button id="google-btn" class="google-btn" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
      <span id="google-btn-text">تسجيل الدخول بحساب Google</span>
    </button>

    <div class="access-note">
      <i class="fas fa-lock"></i>
      <span>هذا الحساب لازم يكون مُضاف مسبقاً من قِبل الإدارة، وإلا لن تتمكن من الدخول</span>
    </div>
  </div>

  <p class="footnote"><i class="fas fa-graduation-cap"></i> بوابة الطلاب — منصة الإدارة</p>
</div>

<script>
/* ================== إعداد Supabase (نفس مشروع الطلاب) ================== */
const SUPABASE_URL = 'https://bzkbamohnjjzwxlvnodm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_u48RJaZLVcDk-rXmzsl0NQ_N9egVFEb';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   غيّر الرمز ده لأي 6 حروف/أرقام تحبها (إنجليزي/أرقام فقط)
   ========================================================= */
const GATE_ACCESS_CODE = 'YS2026';

const MAX_ATTEMPTS = 3;
const LOCKOUT_SECONDS = 30;
let attemptsLeft = MAX_ATTEMPTS;
let lockoutInterval = null;

/* جدول لازم ينشأ في Supabase قبل الاستخدام:
   create table admin_users (
     id uuid primary key references auth.users(id),
     email text, full_name text, avatar_url text,
     selected_year text, created_at timestamptz default now()
   ); */

window.addEventListener('DOMContentLoaded', async () => {
  setupCodeInputs();
  await checkExistingSession();
  document.getElementById('loading-screen').style.display = 'none';
});

async function checkExistingSession(){
  try{
    const { data: { session } } = await _supabase.auth.getSession();
    if(session){
      const isAdmin = await verifyAdmin(session.user.id);
      if(isAdmin){ window.location.href = 'admin-index.html'; return; }
      await _supabase.auth.signOut();
    }
  }catch(e){}
}

async function verifyAdmin(userId){
  const { data, error } = await _supabase.from('admin_users').select('id').eq('id', userId).maybeSingle();
  return !error && !!data;
}

/* ================== المرحلة 1: مربعات الرمز ================== */
function setupCodeInputs(){
  const inputs = document.querySelectorAll('.code-digit');
  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
      inp.classList.toggle('filled', inp.value.length > 0);
      if(inp.value && idx < inputs.length - 1) inputs[idx+1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx-1].focus();
      if(e.key === 'Enter') attemptUnlock();
    });
  });
  inputs[0].focus();
}

function getEnteredCode(){
  return Array.from(document.querySelectorAll('.code-digit')).map(i=>i.value).join('');
}

function showGateError(msg){
  const box = document.getElementById('err-box');
  document.getElementById('err-text').innerText = msg;
  box.classList.add('show');
}
function hideGateError(){ document.getElementById('err-box').classList.remove('show'); }

function attemptUnlock(){
  if(attemptsLeft <= 0) return;
  hideGateError();
  const entered = getEnteredCode();
  const digits = document.querySelectorAll('.code-digit');

  if(entered.length < 6){
    showGateError('أكمل كتابة الرمز أولاً');
    digits.forEach(d => { d.classList.add('error'); setTimeout(()=>d.classList.remove('error'), 400); });
    return;
  }

  if(entered === GATE_ACCESS_CODE){
    playUnlockAnimation();
    return;
  }

  attemptsLeft--;
  digits.forEach(d => { d.classList.add('error'); setTimeout(()=>d.classList.remove('error'), 400); });
  digits.forEach(d => { d.value=''; d.classList.remove('filled'); });
  digits[0].focus();

  if(attemptsLeft <= 0){
    startLockout();
  } else {
    showGateError('رمز غير صحيح');
    document.getElementById('attempts-note').innerText = `تبقّى لديك ${attemptsLeft} محاولة${attemptsLeft===1?'':'ات'}`;
  }
}

function startLockout(){
  showGateError('تم قفل البوابة مؤقتاً بسبب محاولات خاطئة متكررة');
  document.getElementById('unlock-btn').disabled = true;
  document.querySelectorAll('.code-digit').forEach(d => d.disabled = true);
  let remaining = LOCKOUT_SECONDS;
  const note = document.getElementById('attempts-note');
  note.classList.add('lockout-timer');
  note.innerText = `حاول مرة أخرى بعد ${remaining} ثانية`;
  lockoutInterval = setInterval(() => {
    remaining--;
    note.innerText = `حاول مرة أخرى بعد ${remaining} ثانية`;
    if(remaining <= 0){
      clearInterval(lockoutInterval);
      attemptsLeft = MAX_ATTEMPTS;
      note.classList.remove('lockout-timer');
      note.innerText = `لديك ${MAX_ATTEMPTS} محاولات`;
      document.getElementById('unlock-btn').disabled = false;
      document.querySelectorAll('.code-digit').forEach(d => d.disabled = false);
      hideGateError();
    }
  }, 1000);
}

function playUnlockAnimation(){
  document.getElementById('unlock-btn').disabled = true;
  document.querySelectorAll('.code-digit').forEach(d => d.disabled = true);

  const core = document.getElementById('lock-core');
  const icon = document.getElementById('lock-icon');
  const burst = document.getElementById('glow-burst');

  core.classList.add('unlocked');
  icon.className = 'fas fa-lock-open';
  burst.classList.add('play');

  setTimeout(() => {
    document.getElementById('gate-card').style.animation = 'floatIn .4s ease reverse both';
    setTimeout(() => {
      document.getElementById('gate-card').style.display = 'none';
      document.getElementById('login-card').classList.add('show');
    }, 380);
  }, 650);
}

/* ================== المرحلة 2: تسجيل الدخول بجوجل ================== */
function showLoginError(msg){
  const box = document.getElementById('err-box-2');
  document.getElementById('err-text-2').innerText = msg;
  box.classList.add('show');
}

async function handleGoogleLogin(){
  const btn = document.getElementById('google-btn');
  btn.disabled = true;
  document.getElementById('google-btn-text').innerText = 'جاري التحويل إلى Google...';

  const { error } = await _supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });

  if(error){
    showLoginError('تعذر بدء تسجيل الدخول، حاول مرة أخرى');
    btn.disabled = false;
    document.getElementById('google-btn-text').innerText = 'تسجيل الدخول بحساب Google';
  }
}

// لو رجع المستخدم من جوجل بعد الموافقة، نتخطى مرحلة البوابة ونتحقق مباشرة
(async function handleReturnFromOAuth(){
  const { data: { session } } = await _supabase.auth.getSession();
  if(session){
    const isAdmin = await verifyAdmin(session.user.id);
    if(isAdmin){ window.location.href = 'admin-index.html'; }
  }
})();
</script>
</body>
</html>
